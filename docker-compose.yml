# CleanTranslate with Docker Compose.
#
#   docker compose up -d                      # editor on http://SERVER:8080/  admin on /admin
#   docker compose --profile libre up -d      # + a private LibreTranslate engine
#
# Settings come from a .env file next to this one (see .env.example).

services:
  cleantranslate:
    build: .
    image: cleantranslate:latest
    container_name: cleantranslate
    restart: unless-stopped
    ports:
      - "${CT_BIND:-0.0.0.0}:${CT_PORT:-8080}:8080"
    environment:
      BASE_PATH: ${BASE_PATH:-}
      ADMIN_AUTH: ${ADMIN_AUTH:-}
      BASIC_AUTH: ${BASIC_AUTH:-}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      - cleantranslate-data:/data

  # Optional self-hosted, unlimited translation engine (needs ~2–4 GB RAM).
  # After it has downloaded its models, enable "LibreTranslate" in /admin → Engines
  # (its URL http://libretranslate:5000 is already filled in).
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: ["libre"]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,es,fr,de,it,pt}
      LT_UPDATE_MODELS: "true"
    volumes:
      - libretranslate-models:/home/libretranslate/.local

volumes:
  cleantranslate-data:
  libretranslate-models:
