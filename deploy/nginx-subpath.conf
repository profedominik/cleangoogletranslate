# CleanTranslate as a section of an existing site: https://example.com/translate/
# Start the app with BASE_PATH=/translate, then add these blocks inside the
# existing `server { … }` of example.com.

location = /translate {
    return 301 /translate/;
}

location /translate/ {
    # No trailing slash after the port: nginx passes the full /translate/... path,
    # which is what the app expects when BASE_PATH=/translate.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16m;
}
