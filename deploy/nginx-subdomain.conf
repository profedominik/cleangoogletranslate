# CleanTranslate on its own (sub)domain behind nginx.
# The app listens on 127.0.0.1:8080 (HOST=127.0.0.1 in /etc/cleantranslate.env).
# Get a certificate with: certbot --nginx -d translate.example.com

server {
    listen 80;
    server_name translate.example.com;

    client_max_body_size 16m;   # large notes / imports

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
