# CleanTranslate behind Apache (a2enmod proxy proxy_http headers).
# Sub-path variant: start the app with BASE_PATH=/translate.

<VirtualHost *:80>
    ServerName example.com
    ProxyPreserveHost On
    RedirectMatch 301 ^/translate$ /translate/
    ProxyPass        /translate/ http://127.0.0.1:8080/translate/
    ProxyPassReverse /translate/ http://127.0.0.1:8080/translate/
    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>
